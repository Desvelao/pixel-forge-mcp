name: Docker build

on:
  # Reusable: call it from another workflow with `uses: ./.github/workflows/docker-build.yml`
  workflow_call:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: false
      tag:
        description: Extra image tag (e.g. v1.2.3)
        type: string
        default: ""
      platforms:
        description: Target platforms
        type: string
        default: linux/amd64,linux/arm64
    outputs:
      image:
        description: Image name (without tag)
        value: ${{ jobs.build.outputs.image }}
      digest:
        description: Digest of the pushed image (empty when not pushed)
        value: ${{ jobs.build.outputs.digest }}
      version:
        description: Primary version tag
        value: ${{ jobs.build.outputs.version }}
  # On demand: Actions tab -> "Docker build" -> Run workflow
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to GHCR
        type: boolean
        default: false
      tag:
        description: Extra image tag (e.g. v1.2.3)
        type: string
        default: ""
      platforms:
        description: Target platforms
        type: string
        default: linux/amd64,linux/arm64
  # Build + smoke test only (never pushes) on PRs and main
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/desvelao/pixel-forge-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ env.IMAGE }}
      digest: ${{ steps.push.outputs.digest }}
      version: ${{ steps.meta.outputs.version }}
    env:
      DO_PUSH: ${{ inputs.push == true || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
      PLATFORMS: ${{ inputs.platforms || 'linux/amd64,linux/arm64' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.DO_PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=semver,pattern={{version}},value=${{ inputs.tag }},enable=${{ startsWith(inputs.tag, 'v') }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ startsWith(inputs.tag, 'v') && !contains(inputs.tag, '-') }}
            type=raw,value=latest,enable=${{ inputs.tag != '' && !contains(inputs.tag, '-') || github.ref == 'refs/heads/main' }}
            type=sha,format=short

      # Native-arch build loaded into the local daemon, then the smoke test runs
      # as an arbitrary UID to prove the image works for any host user.
      - name: Build (amd64) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          platforms: linux/amd64
          tags: pixel-forge-mcp:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker run --rm -u 12345:12345 --entrypoint python pixel-forge-mcp:smoke test_smoke.py

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: ${{ env.DO_PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
